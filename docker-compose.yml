services:
  api:
    build:
      context: .
      dockerfile: src/Bootstrapper/Turnify.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=mysql;Port=3306;Database=turnify;Uid=turnify;Pwd=turnify_dev_pass;CharSet=utf8mb4;
      - ConnectionStrings__Redis=redis:6379
      - Seq__ServerUrl=http://seq:5341
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - turnify-net

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_pass
      MYSQL_DATABASE: turnify
      MYSQL_USER: turnify
      MYSQL_PASSWORD: turnify_dev_pass
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=256M
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=0.5
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "turnify", "-pturnify_dev_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - turnify-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - turnify-net

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    ports:
      - "5341:5341"
      - "8081:80"
    environment:
      ACCEPT_EULA: Y
    volumes:
      - seq-data:/data
    networks:
      - turnify-net

volumes:
  mysql-data:
  redis-data:
  seq-data:

networks:
  turnify-net:
    driver: bridge
